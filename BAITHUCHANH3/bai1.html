<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảng điểm sinh viên</title>

<style>
table{
    border-collapse: collapse;
    width: 600px;
    margin-top: 20px;
}

table, th, td{
    border:1px solid black;
    padding:8px;
    text-align:center;
}

.low-score{
    background:yellow;
}
</style>

</head>

<body>

<h2>Quản lý điểm sinh viên</h2>

<label>Họ tên:</label>
<input type="text" id="name">

<label>Điểm:</label>
<input type="number" id="score" step="0.1">

<button id="addBtn">Thêm</button>

<table>
<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th>Điểm</th>
<th>Xếp loại</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody id="tableBody">

</tbody>
</table>

<p id="stats"></p>

<script src="bai1,1.js"></script>

</body>
</html>
