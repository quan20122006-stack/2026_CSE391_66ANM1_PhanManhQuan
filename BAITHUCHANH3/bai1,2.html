<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảng điểm sinh viên</title>

<style>

table{
    border-collapse: collapse;
    width: 700px;
    margin-top: 20px;
}

table, th, td{
    border:1px solid black;
    padding:8px;
    text-align:center;
}

.low-score{
    background:yellow;
}

.control{
    margin-top:15px;
}

</style>

</head>

<body>

<h2>Quản lý điểm sinh viên</h2>

<label>Họ tên:</label>
<input type="text" id="name">

<label>Điểm:</label>
<input type="number" id="score" step="0.1">

<button id="addBtn">Thêm</button>

<br>

<div class="control">

<input type="text" id="search" placeholder="Tìm sinh viên...">

<select id="filterRank">

<option value="all">Tất cả</option>
<option value="Giỏi">Giỏi</option>
<option value="Khá">Khá</option>
<option value="Trung bình">Trung bình</option>
<option value="Yếu">Yếu</option>

</select>

</div>

<table>

<thead>

<tr>
<th>STT</th>
<th>Họ tên</th>

<th id="scoreHeader" style="cursor:pointer">
Điểm ▲▼
</th>

<th>Xếp loại</th>
<th>Thao tác</th>
</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

<p id="stats"></p>

<script src="bai1,2.js"></script>

</body>
</html>
